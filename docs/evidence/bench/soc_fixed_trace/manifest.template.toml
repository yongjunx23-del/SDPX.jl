# Copy this template next to an archived report and fill in the immutable
# model digest and scheduler fields.  benchmark.jl emits the same schema.
case = "J40"                       # J40 or J80
mode = "socp"                      # sdp or socp
arithmetic = "Float64x4"           # Float64, Float64x4, BigFloat256
model_path = "/immutable/J40.bin"
model_sha256 = "<64 lowercase hexadecimal characters>"
repetitions = 3
warmup = 1
preflight = true
tolerance = "1e-8"
precision_bits = 256
max_iterations = 400
scaling = "none"                   # native socp must use none

[geometry]
blocks = 4200
variables = 8400
equalities = 170
block_dimensions = [2]              # driver expands this to all blocks

[resources]
julia_version = ""
julia_threads = 1
solver_threads_requested = 1
solver_threads_actual = 1
blas_threads = 1
physical_cores = 0
cpu_threads_visible = 0
cpu_name = ""
cpu_set = ""
numa_policy = ""
memory_total_bytes = 0
memory_available_bytes = 0
peak_rss_bytes = 0
pbs_job_id = ""
pbs_node_file = ""
pbs_requested_slots = ""
hostname = ""

# One table per timed solve is emitted by the driver.
[[runs]]
repetition = 1
wall_seconds = 0.0
allocated_bytes = 0
gc_seconds = 0.0
status = "Optimal"
iterations = 0
certificate_valid = true
