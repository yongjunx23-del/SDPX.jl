name: Benchmark catalog gate

on:
  push:
    branches: [main]
    paths:
      - 'benchmark/**'
      - 'src/**'
      - 'docs/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: benchmark-catalog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog:
    name: Build and validate benchmark catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      SDPX_CATALOG_OUTPUT: ${{ github.workspace }}/catalog-manifest-v2.toml
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
        with:
          cache-name: benchmark-catalog-v2
      - name: Instantiate benchmark environment
        run: julia --startup-file=no --project=benchmark/bootstrap/benchenv -e 'using Pkg; Pkg.instantiate()'
      - name: Build and validate catalog manifest
        run: |
          set -euo pipefail
          julia --startup-file=no --project=benchmark/bootstrap/benchenv \
            benchmark/optimization/catalog_build.jl
          test "$(grep -c '^source_commit' catalog-manifest-v2.toml)" -eq 1
          grep -q "source_commit = \"${GITHUB_SHA}\"" catalog-manifest-v2.toml
      - name: Verify manifest identity
        run: |
          set -euo pipefail
          sha256sum catalog-manifest-v2.toml > catalog-manifest-v2.sha256
          printf '%s\n' "$GITHUB_SHA" > catalog-source-commit.txt
      - name: Upload catalog manifest
        uses: actions/upload-artifact@v4
        with:
          name: sdpx-benchmark-catalog-v2-${{ github.sha }}
          path: |
            catalog-manifest-v2.toml
            catalog-manifest-v2.sha256
            catalog-source-commit.txt
          if-no-files-found: error
          retention-days: 30
