name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect provider-relevant changes
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.filter.outputs.providers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --quiet origin "${{ github.base_ref }}" --depth=1
            changed="$(git diff --name-only "$base"...HEAD)"
          else
            changed="$(git diff --name-only HEAD^ HEAD 2>/dev/null || git diff --name-only $(git hash-object -t tree /dev/null) HEAD)"
          fi
          echo "changed files:"
          echo "$changed"
          if echo "$changed" | grep -qE \
            '^(\.github/workflows/test\.yml$|ext/|src/factor_cache/|src/la_backends/|src/kernels/extended_precision_blas/|src/kernels/mixed_precision_kkt\.jl|validation/providers/|Project\.toml$)'; then
            echo "providers=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Julia ${{ matrix.julia }} / ${{ matrix.os }} / ${{ matrix.threads }} threads
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Two ubuntu legs cover the black-box E2E on LTS/serial and the current
        # release/threaded runtime. Specialist checks use validation/ and
        # benchmark jobs rather than additional package-test profiles.
        include:
          - julia: '1.10'
            os: ubuntu-latest
            threads: '1'
          - julia: '1'
            os: ubuntu-latest
            threads: '4'
          # Spot-check the other platforms once, on the current release. The
          # thread count is part of the matrix rather than fixed because several
          # kernels have threaded and serial paths that must agree exactly.
          - julia: '1'
            os: macOS-latest
            threads: '4'
          - julia: '1'
            os: windows-latest
            threads: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      # A shared cache name lets every leg cross-restore the dependency and
      # precompile caches instead of recompiling the world per leg.
      - uses: julia-actions/cache@v2
        with:
          cache-name: julia-depot
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads }}

  bench-smoke:
    name: Benchmark smoke test (small tier only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
        with:
          cache-name: julia-depot
      - name: Instantiate benchmark environment
        run: julia --project=benchmark/bootstrap/benchenv -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      # The fixture catalog exposes one canonical `smoke` suite. Larger
      # registered physics suites need generated or downloaded inputs and are
      # run manually with their explicit catalog paths.
      - name: Run canonical benchmark smoke
        run: julia --project=benchmark/bootstrap/benchenv benchmark/bootstrap/runner.jl smoke --samples=1 --output=/tmp/sdpx-smoke.toml

  provider-smoke:
    name: MFLA/BFLA provider smoke
    needs: changes
    # Provider installs are slow; only pay for them when the provider-facing
    # surface changed, or on main pushes where the signal is recorded.
    if: needs.changes.outputs.providers == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
        with:
          cache-name: julia-depot
      - name: Clone pinned released provider checkouts
        run: |
          git clone https://github.com/yongjunx23-del/MultiFloatLinearAlgebra.jl.git "$RUNNER_TEMP/MFLA"
          # MultiFloatLinearAlgebra v0.4.0, matching SDPX [compat].
          git -C "$RUNNER_TEMP/MFLA" checkout b38dea165d0973ae06ce245dbdf11298b123c9ea
          git clone https://github.com/yongjunx23-del/BigFloatLinearAlgebra.jl.git "$RUNNER_TEMP/BFLA"
          # BigFloatLinearAlgebra v0.3.0, matching SDPX [compat].
          git -C "$RUNNER_TEMP/BFLA" checkout f95d3e623990e8ae5848916ba92d93897dcb1e31
      - name: Build provider smoke environment
        env:
          SDPX_PROJECT: ${{ github.workspace }}
          SDPX_MFLA_PROJECT: ${{ runner.temp }}/MFLA
          SDPX_BFLA_PROJECT: ${{ runner.temp }}/BFLA
          SDPX_PROVIDER_ENV: ${{ runner.temp }}/provider-smoke
        run: |
          mkdir -p "$SDPX_PROVIDER_ENV"
          julia --startup-file=no --project="$SDPX_PROVIDER_ENV" -e '
            using Pkg
            Pkg.develop(path=ENV["SDPX_PROJECT"])
            Pkg.develop(path=ENV["SDPX_MFLA_PROJECT"])
            Pkg.develop(path=ENV["SDPX_BFLA_PROJECT"])
            Pkg.add(["MultiFloats", "GenericLinearAlgebra"])
          '
      - name: Run installed-provider smoke and extension gates
        env:
          SDPX_PROVIDER_ENV: ${{ runner.temp }}/provider-smoke
          SDPX_MFLA_PROJECT: ${{ runner.temp }}/MFLA
          SDPX_BFLA_PROJECT: ${{ runner.temp }}/BFLA
          SDPX_PROVIDER_SMOKE_TARGET: all
        run: |
          julia --startup-file=no --project="$SDPX_PROVIDER_ENV" -t1 validation/providers/provider_smoke.jl
          julia --startup-file=no --project="$SDPX_PROVIDER_ENV" -t1 validation/providers/multifloat_linear_algebra_integration.jl

  v2-gates:
    name: v2 acceptance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
        with:
          cache-name: julia-depot
      - uses: julia-actions/julia-buildpkg@v1
      # Each gate is a standalone script that exits non-zero on failure, so a
      # single job can run them in sequence and fail on the first break.
      - name: Install fixed-width arithmetic used by the HSD gate
        run: julia --project=. -e 'using Pkg; Pkg.add("MultiFloats")'
      # The gate runs the native product-cone HSD (product_hsd_cold_start! /
      # product_hsd_step!) allocation audit; legacy engine entry points are
      # not exercised.
      - name: Native product-HSD allocation hard gate
        run: julia --project=. benchmark/general/performance/hsd_allocation.jl --check

  quality:
    name: Package quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Project.toml is registry-ready
        run: |
          julia -e '
            using TOML
            p = TOML.parsefile("Project.toml")
            for key in ("name", "uuid", "version", "authors")
                haskey(p, key) || error("Project.toml is missing $key")
            end
            # Guard against ever re-inheriting the upstream SDPJSolver.jl UUID.
            p["uuid"] == "e804a123-63fa-4b55-87b9-d771b4a5c602" &&
                error("Project.toml still carries the upstream SDPJSolver.jl UUID")
            (haskey(p, "compat") && haskey(p["compat"], "julia")) ||
                error("Project.toml needs a [compat] entry for julia")
            println("Project.toml OK: ", p["name"], " v", p["version"], " ", p["uuid"] )'
      - name: Release metadata and auxiliary compat are consistent
        run: julia scripts/check_release_metadata.jl
      - name: Upstream solver implementation is not vendored
        run: |
          test ! -e src/functions.jl
          test ! -e src/SDPJSolver.jl
          if grep -R -nE \
            '^[[:space:]]*function[[:space:]]+(getResidue|NewtonStep|NewtonStepSparse|f1|df|f|sdpBFGS|findFeasibleBFGS)[[:space:]]*\(' \
            src; then
            echo "An implementation from the former SDPJSolver.jl core was reintroduced"
            exit 1
          fi
          if grep -R -nE '^[[:space:]]*module[[:space:]]+SDPJSolver([[:space:]]|$)' src; then
            echo "The former SDPJSolver module was reintroduced"
            exit 1
          fi
          echo "No former SDPJSolver numerical implementation is present"
      - name: No large or generated files committed
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +2M -print)
          if [ -n "$big" ]; then echo "Files over 2MB are committed:"; echo "$big"; exit 1; fi
          if git ls-files | grep -qE '(^|/)Manifest\.toml$'; then
            echo "Manifest.toml must not be committed for a package"; exit 1
          fi
          echo "No oversized or generated files committed"

  docs:
    name: Documentation build
    # Page integrity is enforced per-PR by quick-checks.yml; the full
    # Documenter build only runs where its output is used.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
        with:
          cache-name: julia-depot
      - name: Build the Documenter site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          julia --project=docs -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
          julia --project=docs docs/make.jl
