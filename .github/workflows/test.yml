name: CI

on:
  push:
    branches:
      - main
      - refactor/benchmark-driven-core-20260821
    tags: ['*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia }} / ${{ matrix.os }} / ${{ matrix.threads }} threads / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1']
        os: [ubuntu-latest]
        threads: ['1', '4']
        profile: ['quick']
        include:
          # Spot-check the other platforms once, on the current release. The
          # thread count is part of the matrix rather than fixed because several
          # kernels have threaded and serial paths that must agree exactly.
          - julia: '1'
            os: macOS-latest
            threads: '4'
            profile: quick
          - julia: '1'
            os: windows-latest
            threads: '4'
            profile: quick
          # Run the expensive numerical/extension matrix once. Cross-version,
          # cross-platform, and serial/threaded compatibility are already
          # covered by the quick jobs above.
          - julia: '1'
            os: ubuntu-latest
            threads: '4'
            profile: full
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads }}
          SDPX_TEST_PROFILE: ${{ matrix.profile }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.profile == 'full'
      - uses: codecov/codecov-action@v5
        if: matrix.profile == 'full'
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: true
          flags: unittests
          name: sdpx-julia

  bench-smoke:
    name: Benchmark smoke test (small tier only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Instantiate benchmark environment
        run: julia --project=bench -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      # Only the canonical micro suite runs in CI. Larger registered suites
      # need generated or downloaded inputs and are run manually.
      - name: Run canonical micro benchmark smoke
        run: julia --project=bench benchmark/runner.jl micro --output=/tmp/sdpx-micro.toml

  provider-smoke:
    name: MFLA/BFLA provider smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Clone pinned provider checkouts
        run: |
          git clone https://github.com/yongjunx23-del/MultiFloatLinearAlgebra.jl.git "$RUNNER_TEMP/MFLA"
          git -C "$RUNNER_TEMP/MFLA" checkout 2b93685c773db323e9397e448063925dc6cb96fe
          git clone https://github.com/yongjunx23-del/BigFloatLinearAlgebra.jl.git "$RUNNER_TEMP/BFLA"
          git -C "$RUNNER_TEMP/BFLA" checkout b2aed396718d03c60faf017388c3e2fc30934513
      - name: Build provider smoke environment
        env:
          SDPX_PROJECT: ${{ github.workspace }}
          SDPX_MFLA_PROJECT: ${{ runner.temp }}/MFLA
          SDPX_BFLA_PROJECT: ${{ runner.temp }}/BFLA
          SDPX_PROVIDER_ENV: ${{ runner.temp }}/provider-smoke
        run: |
          mkdir -p "$SDPX_PROVIDER_ENV"
          julia --startup-file=no --project="$SDPX_PROVIDER_ENV" -e '
            using Pkg
            Pkg.develop(path=ENV["SDPX_PROJECT"])
            Pkg.develop(path=ENV["SDPX_MFLA_PROJECT"])
            Pkg.develop(path=ENV["SDPX_BFLA_PROJECT"])
            Pkg.add(["MultiFloats", "GenericLinearAlgebra"])
          '
      - name: Run installed-provider smoke and extension gates
        env:
          SDPX_PROVIDER_ENV: ${{ runner.temp }}/provider-smoke
          SDPX_MFLA_PROJECT: ${{ runner.temp }}/MFLA
          SDPX_BFLA_PROJECT: ${{ runner.temp }}/BFLA
          SDPX_PROVIDER_SMOKE_TARGET: all
        run: |
          julia --startup-file=no --project="$SDPX_PROVIDER_ENV" -t1 test/provider_smoke.jl
          julia --startup-file=no --project="$SDPX_PROVIDER_ENV" -t1 test/multifloat_linear_algebra_integration.jl

  quality:
    name: Package quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Project.toml is registry-ready
        run: |
          julia -e '
            using TOML
            p = TOML.parsefile("Project.toml")
            for key in ("name", "uuid", "version", "authors")
                haskey(p, key) || error("Project.toml is missing $key")
            end
            # Guard against ever re-inheriting the upstream SDPJSolver.jl UUID.
            p["uuid"] == "e804a123-63fa-4b55-87b9-d771b4a5c602" &&
                error("Project.toml still carries the upstream SDPJSolver.jl UUID")
            (haskey(p, "compat") && haskey(p["compat"], "julia")) ||
                error("Project.toml needs a [compat] entry for julia")
            println("Project.toml OK: ", p["name"], " v", p["version"], " ", p["uuid"])'
      - name: Release metadata and auxiliary compat are consistent
        run: julia scripts/check_release_metadata.jl
      - name: Upstream solver implementation is not vendored
        run: |
          test ! -e src/functions.jl
          test ! -e src/SDPJSolver.jl
          if grep -R -nE \
            '^[[:space:]]*function[[:space:]]+(getResidue|NewtonStep|NewtonStepSparse|f1|df|f|sdpBFGS|findFeasibleBFGS)[[:space:]]*\(' \
            src; then
            echo "An implementation from the former SDPJSolver.jl core was reintroduced"
            exit 1
          fi
          if grep -R -nE '^[[:space:]]*module[[:space:]]+SDPJSolver([[:space:]]|$)' src; then
            echo "The former SDPJSolver module was reintroduced"
            exit 1
          fi
          echo "No former SDPJSolver numerical implementation is present"
      - name: No large or generated files committed
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +2M -print)
          if [ -n "$big" ]; then echo "Files over 2MB are committed:"; echo "$big"; exit 1; fi
          if git ls-files | grep -qE '(^|/)Manifest\.toml$'; then
            echo "Manifest.toml must not be committed for a package"; exit 1
          fi
          echo "No oversized or generated files committed"

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Build the Documenter site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          julia --project=docs -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
          julia --project=docs docs/make.jl

  optimization-gate:
    name: Benchmark-driven optimization gate
    if: github.event_name == 'pull_request' && github.base_ref == 'refactor/benchmark-driven-core-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OUT_DIR: ${{ github.workspace }}/optimization-artifacts
      BASELINE_DIR: ${{ runner.temp }}/sdpx-parent
      BASELINE_ENV: ${{ runner.temp }}/sdpx-parent-env
      CANDIDATE_ENV: ${{ runner.temp }}/sdpx-candidate-env
      MFLA_DIR: ${{ runner.temp }}/MFLA
      BFLA_DIR: ${{ runner.temp }}/BFLA
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Prepare parent source and pinned providers
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          git worktree add --detach "$BASELINE_DIR" HEAD^
          git clone https://github.com/yongjunx23-del/MultiFloatLinearAlgebra.jl.git "$MFLA_DIR"
          git -C "$MFLA_DIR" checkout 2b93685c773db323e9397e448063925dc6cb96fe
          git clone https://github.com/yongjunx23-del/BigFloatLinearAlgebra.jl.git "$BFLA_DIR"
          git -C "$BFLA_DIR" checkout b2aed396718d03c60faf017388c3e2fc30934513
      - name: Build isolated baseline and candidate environments
        run: |
          set -euo pipefail
          mkdir -p "$BASELINE_ENV" "$CANDIDATE_ENV"
          for pair in "$BASELINE_ENV:$BASELINE_DIR" "$CANDIDATE_ENV:$GITHUB_WORKSPACE"; do
            environment="${pair%%:*}"
            source_dir="${pair#*:}"
            SDPX_SOURCE="$source_dir" julia --startup-file=no --project="$environment" -e '
              using Pkg
              Pkg.develop(path=ENV["SDPX_SOURCE"])
              Pkg.develop(path=ENV["MFLA_DIR"])
              Pkg.develop(path=ENV["BFLA_DIR"])
              Pkg.add(["MultiFloats", "GenericLinearAlgebra", "StableRNGs"])
              Pkg.precompile()
            '
          done 2>&1 | tee "$OUT_DIR/benchmark-environments.log"
      - name: Run parent and candidate canonical micro suites
        run: |
          set -euo pipefail
          julia --startup-file=no --project="$BASELINE_ENV" \
            "$BASELINE_DIR/benchmark/runner.jl" micro \
            --samples=3 --output="$OUT_DIR/baseline-micro.toml" --verbose \
            2>&1 | tee "$OUT_DIR/baseline-micro.log"
          julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/runner.jl micro \
            --samples=3 --output="$OUT_DIR/candidate-micro.toml" --verbose \
            2>&1 | tee "$OUT_DIR/candidate-micro.log"
          julia --startup-file=no --project="$CANDIDATE_ENV" benchmark/compare.jl \
            "$OUT_DIR/baseline-micro.toml" "$OUT_DIR/candidate-micro.toml" \
            "$OUT_DIR/micro-comparison.tsv" \
            2>&1 | tee "$OUT_DIR/micro-comparison.log"
      - name: Run parent and candidate precision matrices
        run: |
          set -euo pipefail
          julia --startup-file=no --project="$BASELINE_ENV" \
            "$BASELINE_DIR/benchmark/runner.jl" core_matrix \
            --samples=3 --output="$OUT_DIR/baseline-core-matrix.toml" --verbose \
            2>&1 | tee "$OUT_DIR/baseline-core-matrix.log"
          julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/runner.jl core_matrix \
            --samples=3 --output="$OUT_DIR/candidate-core-matrix.toml" --verbose \
            2>&1 | tee "$OUT_DIR/candidate-core-matrix.log"
          julia --startup-file=no --project="$CANDIDATE_ENV" benchmark/compare.jl \
            "$OUT_DIR/baseline-core-matrix.toml" "$OUT_DIR/candidate-core-matrix.toml" \
            "$OUT_DIR/core-matrix-comparison.tsv" \
            2>&1 | tee "$OUT_DIR/core-matrix-comparison.log"
      - name: Run three-process candidate stability matrix
        run: |
          set -euo pipefail
          julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/core_matrix_fresh_process.jl \
            --project="$CANDIDATE_ENV" --repetitions=3 \
            --threads=1 --blas-threads=1 \
            --campaign-dir="$OUT_DIR/fresh-core-matrix" --verbose \
            2>&1 | tee "$OUT_DIR/fresh-core-matrix.log"
      - name: Record source identities
        if: always()
        run: |
          mkdir -p "$OUT_DIR"
          git rev-parse HEAD > "$OUT_DIR/source-commit.txt"
          git rev-parse HEAD^ > "$OUT_DIR/parent-commit.txt"
          git diff --check > "$OUT_DIR/diff-check.txt"
      - name: Upload optimization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdpx-optimization-${{ github.sha }}
          path: optimization-artifacts
          if-no-files-found: error
          retention-days: 30
