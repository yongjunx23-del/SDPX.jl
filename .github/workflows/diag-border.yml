name: Diagnose bordered LP x86 gate trace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: ${{ matrix.os }} / ${{ matrix.threads }}t
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            threads: '1'
          - os: ubuntu-latest
            threads: '4'
          - os: macos-latest
            threads: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
        with:
          cache-name: julia-depot
      - uses: julia-actions/julia-buildpkg@v1
      - name: Export bordered LP five-equation gate trace
        shell: bash
        env:
          SDPX_DEBUG_DIRECTION: '1'
          JULIA_NUM_THREADS: ${{ matrix.threads }}
        run: |
          cat > diag_gate.jl <<'JLEOF'
          using SDPX
          println("PATHOF_SDPX=", pathof(SDPX))
          println("MACHINE=", Sys.MACHINE, " cpu=", Sys.CPU_NAME)
          model = SDPX.Model(Float64)
          y = SDPX.variable!(model, :y, 2; domain=SDPX.Reals())
          SDPX.constraint!(model, :b1, y[1], SDPX.Nonnegative())
          SDPX.constraint!(model, :b2, y[2], SDPX.Nonnegative())
          SDPX.constraint!(model, :b3, 5.0 - y[1], SDPX.Nonnegative())
          SDPX.constraint!(model, :b4, 5.0 - y[2], SDPX.Nonnegative())
          for i in 1:8
              SDPX.constraint!(model, Symbol(:c, i), (10.0 + i) - y[1] - y[2],
                  SDPX.Nonnegative())
          end
          SDPX.objective!(model, SDPX.Minimize(), y[1] + y[2])
          result = SDPX.optimize!(model;
              settings=SDPX.Settings(Float64; verbosity=0, kkt_route=:bordered))
          println("FINAL_STATUS=", SDPX.status(result))
          println("CERT_VALID=", SDPX.certificate(result).valid)
          println("ITERS=", SDPX.iterations(result))
          JLEOF
          julia --startup-file=no --project=. diag_gate.jl 2>&1 | tee gate_trace.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-trace-${{ matrix.os }}-${{ matrix.threads }}t
          path: gate_trace.txt
