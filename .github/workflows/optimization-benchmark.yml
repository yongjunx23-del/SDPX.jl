name: Optimization benchmark (reusable)

# Schema-v9 candidate benchmark pipeline called by optimization-loop.yml. The
# caller records evidence in git history and posts the
# `sdpx/optimization-loop` commit status.
#
# The pipeline always uploads its artifacts as
# `sdpx-optimization-${{ github.sha }}`, so a caller can download them for
# evidence persistence or inspection.

on:
  workflow_call:
    inputs:
      post_status:
        description: 'Post pending/final sdpx/optimization-loop commit statuses.'
        required: false
        type: boolean
        default: false
      base_sha:
        description: 'Explicit 40-hex base commit for the base-vs-candidate comparison.'
        required: true
        type: string

# No permissions block here on purpose: a called workflow's explicit
# permissions would narrow the caller's grant, breaking the status step. The
# caller declares the exact job permissions it needs.

jobs:
  correctness-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OUT_DIR: ${{ github.workspace }}/optimization-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The runner context is unavailable in job-level env (GitHub rejects
      # the workflow at parse time), so the scratch paths are exported in
      # this first step; every later step reads them unchanged.
      - name: Define benchmark scratch paths
        shell: bash
        run: |
          cat >> "$GITHUB_ENV" <<'EOF'
          CANDIDATE_ENV=$RUNNER_TEMP/sdpx-candidate-env
          EOF

      - name: Mark optimization gate pending
        if: inputs.post_status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='sdpx/optimization-loop' \
            -f description='correctness and parent-versus-candidate benchmarks are running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - uses: julia-actions/cache@v2

      - name: Run quick correctness suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          julia --startup-file=no --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.test(; coverage=false)
          ' 2>&1 | tee "$OUT_DIR/quick-tests.log"

      - name: Build isolated candidate benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CANDIDATE_ENV"
          SDPX_SOURCE="$GITHUB_WORKSPACE" julia --startup-file=no --project="$CANDIDATE_ENV" -e '
            using Pkg
            Pkg.develop(path=ENV["SDPX_SOURCE"])
            Pkg.add(["MultiFloats", "GenericLinearAlgebra", "StableRNGs"])
            Pkg.precompile()
          ' 2>&1 | tee "$OUT_DIR/benchmark-environment.log"

      - name: Run schema-v9 deterministic smoke suite
        shell: bash
        run: |
          set -euo pipefail
          julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/bootstrap/runner.jl smoke \
            --samples=3 --output="$OUT_DIR/candidate-smoke.toml" --verbose \
            2>&1 | tee "$OUT_DIR/candidate-smoke.log"

      - name: Run native product-HSD allocation audit (evidence only)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          # Allocation is secondary telemetry. The permanently-red zero-byte
          # hard gate is intentionally not restored; correctness and profile
          # certification remain strict.
          julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/general/performance/hsd_allocation.jl \
            2>&1 | tee "$OUT_DIR/hsd-allocation.log"
          rc=${PIPESTATUS[0]}
          printf 'allocation_status=%s\n' "$([ "$rc" -eq 0 ] && echo pass || echo failed)" \
            > "$OUT_DIR/allocation-status.txt"
          exit 0

      - name: Run fresh-process stability matrix on candidate
        shell: bash
        run: |
          set -euo pipefail
          julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/bootstrap/fresh_process_runner.jl smoke \
            --problem=smoke/lp_box \
            --arithmetic=float64 \
            --provider=auto \
            --execution-mode=solve \
            --engine=auto \
            --catalog=benchmark/bootstrap/fixtures/smoke_catalog.jl \
            --project="$CANDIDATE_ENV" \
            --repetitions=3 \
            --threads=1 \
            --blas-threads=1 \
            --campaign-dir="$OUT_DIR/fresh-smoke" \
            --verbose \
            2>&1 | tee "$OUT_DIR/fresh-smoke.log"
          julia --startup-file=no --project="$CANDIDATE_ENV" -e '
            using TOML
            summary = TOML.parsefile(ARGS[1])
            @assert summary["campaign"]["aggregation_valid"] === true
            @assert summary["campaign"]["pairing_valid"] === true
          ' "$OUT_DIR/fresh-smoke/summary.toml"

      - name: Validate base SHA and ancestry
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "base_sha must be exactly 40 hexadecimal characters" >&2
            exit 1
          fi
          candidate_sha="$(git rev-parse --verify HEAD^{commit})"
          base_sha="$(git rev-parse --verify "${BASE_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$base_sha" "$candidate_sha"; then
            echo "base_sha '$base_sha' is not an ancestor of candidate '$candidate_sha'" >&2
            exit 1
          fi
          {
            printf 'SDPX_BASE_SHA=%s\n' "$base_sha"
            printf 'SDPX_CANDIDATE_SHA=%s\n' "$candidate_sha"
          } >> "$GITHUB_ENV"

      - name: Run base schema-v9 smoke suite
        shell: bash
        run: |
          set -euo pipefail
          restore_candidate() {
            git checkout --detach "$SDPX_CANDIDATE_SHA"
          }
          trap restore_candidate EXIT
          git checkout --detach "$SDPX_BASE_SHA"
          julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/bootstrap/runner.jl smoke \
            --samples=3 --output="$OUT_DIR/base-smoke.toml" --verbose \
            2>&1 | tee "$OUT_DIR/base-smoke.log"
          trap - EXIT
          git checkout --detach "$SDPX_CANDIDATE_SHA"

      - name: Compare complete schema-v9 base and candidate files
        shell: bash
        run: |
          set -euo pipefail
          # compare.jl performs strict schema, identity, route, certificate,
          # sample, and semantic pairing checks and exits nonzero on any row.
          julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/compare.jl "$OUT_DIR/base-smoke.toml" \
            "$OUT_DIR/candidate-smoke.toml" \
            "$OUT_DIR/base-vs-candidate.tsv" \
            2>&1 | tee "$OUT_DIR/base-vs-candidate.log"
          test -s "$OUT_DIR/base-vs-candidate.tsv"
          grep -q 'comparison_valid' "$OUT_DIR/base-vs-candidate.tsv"
          ! grep -q $'comparison_valid\\tfalse' "$OUT_DIR/base-vs-candidate.tsv"

      - name: Record source and environment identity
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "$OUT_DIR"
          git rev-parse HEAD > "$OUT_DIR/source-commit.txt"
          git status --porcelain=v1 > "$OUT_DIR/source-status.txt"
          git diff --check > "$OUT_DIR/diff-check.txt"
          git rev-parse HEAD^{tree} > "$OUT_DIR/tree-fingerprint.txt"
          if julia --version > "$OUT_DIR/julia-version.txt" 2>&1; then :; else
            echo 'julia --version unavailable (unexpected for this workflow)' > "$OUT_DIR/julia-version.txt"
          fi
          uname -a > "$OUT_DIR/uname.txt"

      - name: Upload complete optimization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdpx-optimization-${{ github.sha }}
          path: optimization-artifacts
          if-no-files-found: error
          retention-days: 30
