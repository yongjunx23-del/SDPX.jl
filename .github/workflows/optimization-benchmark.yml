name: Optimization benchmark (reusable)

# Schema-v7 candidate benchmark pipeline called by optimization-loop.yml. The
# caller records evidence in git history and posts the
# `sdpx/optimization-loop` commit status.
#
# The pipeline always uploads its artifacts as
# `sdpx-optimization-${{ github.sha }}`, so a caller can download them for
# evidence persistence or inspection.

on:
  workflow_call:
    inputs:
      post_status:
        description: 'Post pending/final sdpx/optimization-loop commit statuses.'
        required: false
        type: boolean
        default: false

# No permissions block here on purpose: a called workflow's explicit
# permissions would narrow the caller's grant, breaking the status step. The
# caller declares the exact job permissions it needs.

jobs:
  correctness-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      SDPX_TEST_PROFILE: quick
      OUT_DIR: ${{ github.workspace }}/optimization-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The runner context is unavailable in job-level env (GitHub rejects
      # the workflow at parse time), so the scratch paths are exported in
      # this first step; every later step reads them unchanged.
      - name: Define benchmark scratch paths
        shell: bash
        run: |
          cat >> "$GITHUB_ENV" <<'EOF'
          CANDIDATE_ENV=$RUNNER_TEMP/sdpx-candidate-env
          EOF

      - name: Mark optimization gate pending
        if: inputs.post_status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='sdpx/optimization-loop' \
            -f description='correctness and parent-versus-candidate benchmarks are running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - uses: julia-actions/cache@v2

      - name: Run quick correctness suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          julia --startup-file=no --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.test(; coverage=false)
          ' 2>&1 | tee "$OUT_DIR/quick-tests.log"

      - name: Build isolated candidate benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CANDIDATE_ENV"
          SDPX_SOURCE="$GITHUB_WORKSPACE" julia --startup-file=no --project="$CANDIDATE_ENV" -e '
            using Pkg
            Pkg.develop(path=ENV["SDPX_SOURCE"])
            Pkg.add(["MultiFloats", "GenericLinearAlgebra", "StableRNGs"])
            Pkg.precompile()
          ' 2>&1 | tee "$OUT_DIR/benchmark-environment.log"

      - name: Run schema-v7 deterministic smoke suite
        shell: bash
        run: |
          set -euo pipefail
          julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/runner.jl smoke \
            --samples=3 --output="$OUT_DIR/candidate-smoke.toml" --verbose \
            2>&1 | tee "$OUT_DIR/candidate-smoke.log"

      - name: Run native HSD allocation gate
        shell: bash
        run: |
          set -euo pipefail
          julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/hsd_allocation.jl --check \
            2>&1 | tee "$OUT_DIR/hsd-allocation.log"

      - name: Run fresh-process stability matrix on candidate
        shell: bash
        run: |
          set -euo pipefail
          julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/fresh_process_runner.jl smoke \
            --problem=smoke/lp_box \
            --arithmetic=float64 \
            --provider=auto \
            --catalog=benchmark/fixtures/smoke_catalog.jl \
            --project="$CANDIDATE_ENV" \
            --repetitions=3 \
            --threads=1 \
            --blas-threads=1 \
            --campaign-dir="$OUT_DIR/fresh-smoke" \
            --verbose \
            2>&1 | tee "$OUT_DIR/fresh-smoke.log"

      - name: Record source and environment identity
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "$OUT_DIR"
          git rev-parse HEAD > "$OUT_DIR/source-commit.txt"
          git status --porcelain=v1 > "$OUT_DIR/source-status.txt"
          git diff --check > "$OUT_DIR/diff-check.txt"
          julia --version > "$OUT_DIR/julia-version.txt" 2>&1 || true
          uname -a > "$OUT_DIR/uname.txt"

      - name: Upload complete optimization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdpx-optimization-${{ github.sha }}
          path: optimization-artifacts
          if-no-files-found: error
          retention-days: 30
