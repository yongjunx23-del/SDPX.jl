name: Codex apply N3 equality scaling

on:
  push:
    branches:
      - development/v0.5-execution-plan
    paths:
      - .codex/n3-kkt.patch
      - .codex/n3-workspace.patch
      - .codex/n3-tests.patch
      - .github/workflows/codex-apply-n3-equality-scaling.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Apply runtime equality scaling patches
        run: |
          set -euo pipefail
          if git log --format=%s -n 50 | grep -Fxq 'fix: normalize runtime equality coordinates'; then
            echo 'Runtime equality scaling fix is already present.'
            exit 0
          fi
          git apply --check .codex/n3-workspace.patch
          git apply .codex/n3-workspace.patch
          git apply --check .codex/n3-kkt.patch
          git apply .codex/n3-kkt.patch
          git apply --check .codex/n3-tests.patch
          git apply .codex/n3-tests.patch
          git diff --check
          echo 'b5ce3c2d11a2fc45f0f202a37cf5564f19f076e8de2090af7687235d25f24938  src/kkt.jl' | sha256sum -c -
          echo '4c352c3e7fc4becca5dd1b5f4910587097919518f052da787bc6eeacd1a6ef8f  src/workspace.jl' | sha256sum -c -
          echo 'd34cb243f3b87f27159fabe7d08dda1f43cfefb5933c5ffcf378a227f97a5389  test/kkt_regressions.jl' | sha256sum -c -
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run full numerical regression gate before push
        env:
          JULIA_NUM_THREADS: '4'
          SDPX_TEST_PROFILE: full
        run: julia --startup-file=no --project=. -t4 -e 'using Pkg; Pkg.test(; coverage=false)'
      - name: Commit and push tested equality scaling fix
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.invalid'
          git add src/kkt.jl src/workspace.jl test/kkt_regressions.jl
          git diff --cached --check
          git commit -m 'fix: normalize runtime equality coordinates'
          git push origin HEAD:development/v0.5-execution-plan
