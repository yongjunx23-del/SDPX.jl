name: Codex export source snapshot

on:
  push:
    branches:
      - development/v0.5-execution-plan
    paths:
      - .github/workflows/codex-export-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package source snapshot
        run: |
          set -euo pipefail
          git rev-parse HEAD > CODEX_EXPORT_HEAD.txt
          git rev-parse 'HEAD^{tree}' > CODEX_EXPORT_TREE.txt
          git status --porcelain=v1 > CODEX_EXPORT_STATUS.txt
          tar --exclude=.git -czf "$RUNNER_TEMP/sdpx-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: sdpx-source-${{ github.sha }}
          path: ${{ runner.temp }}/sdpx-source.tar.gz
          if-no-files-found: error
          retention-days: 1
