name: Materialize canonical v0.5 execution plan

on:
  push:
    branches:
      - development/v0.5-execution-plan
    paths:
      - .github/workflows/codex-materialize-canonical-plan.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/v0.5-execution-plan
          fetch-depth: 0

      - name: Reconstruct and verify canonical plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          payload = (
              Path('.codex/canonical-plan.gz.b64.part1').read_text().strip()
              + Path('.codex/canonical-plan.gz.b64.part2').read_text().strip()
          )
          data = gzip.decompress(base64.b64decode(payload, validate=True))
          expected_sha = 'e3d58085ea09625814f146c7e382fbc3f8c498e6310c6de50cc1677de5e0f31d'
          actual_sha = hashlib.sha256(data).hexdigest()
          assert actual_sha == expected_sha, (actual_sha, expected_sha)
          assert len(data) == 62586, len(data)
          assert data.count(b'\n') == 2244, data.count(b'\n')
          assert data.startswith('# SDPX.jl v0.5 Codex 统一执行主计划'.encode())
          assert data.rstrip().endswith('全部闭合。'.encode())

          out = Path('docs/development/SDPX_v0.5_execution_plan.md')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)
          print(f'canonical plan sha256={actual_sha} bytes={len(data)} lines={data.count(bytes([10]))}')
          PY

      - name: Commit canonical plan
        shell: bash
        run: |
          git add docs/development/SDPX_v0.5_execution_plan.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: add canonical v0.5 execution plan'
          git push origin HEAD:development/v0.5-execution-plan
