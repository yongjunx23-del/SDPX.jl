name: Optimization loop

on:
  push:
    branches:
      - refactor/benchmark-driven-core-20260821
    paths-ignore:
      - 'benchmark/history/**'
  workflow_dispatch:

concurrency:
  group: optimization-loop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  statuses: write

jobs:
  correctness-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      SDPX_TEST_PROFILE: quick
      OUT_DIR: ${{ github.workspace }}/optimization-artifacts
      BASELINE_DIR: ${{ runner.temp }}/sdpx-parent
      BASELINE_ENV: ${{ runner.temp }}/sdpx-parent-env
      CANDIDATE_ENV: ${{ runner.temp }}/sdpx-candidate-env
      MFLA_DIR: ${{ runner.temp }}/MFLA
      BFLA_DIR: ${{ runner.temp }}/BFLA
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark optimization gate pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='sdpx/optimization-loop' \
            -f description='correctness and parent-versus-candidate benchmarks are running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - uses: julia-actions/cache@v2

      - name: Run quick correctness suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          julia --startup-file=no --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.test(; coverage=false)
          ' 2>&1 | tee "$OUT_DIR/quick-tests.log"

      - name: Prepare parent source and pinned providers
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$BASELINE_DIR" HEAD^
          git clone https://github.com/yongjunx23-del/MultiFloatLinearAlgebra.jl.git "$MFLA_DIR"
          git -C "$MFLA_DIR" checkout 2b93685c773db323e9397e448063925dc6cb96fe
          git clone https://github.com/yongjunx23-del/BigFloatLinearAlgebra.jl.git "$BFLA_DIR"
          git -C "$BFLA_DIR" checkout b2aed396718d03c60faf017388c3e2fc30934513

      - name: Build isolated baseline and candidate environments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BASELINE_ENV" "$CANDIDATE_ENV"
          for pair in "$BASELINE_ENV:$BASELINE_DIR" "$CANDIDATE_ENV:$GITHUB_WORKSPACE"; do
            environment="${pair%%:*}"
            source_dir="${pair#*:}"
            SDPX_SOURCE="$source_dir" julia --startup-file=no --project="$environment" -e '
              using Pkg
              Pkg.develop(path=ENV["SDPX_SOURCE"])
              Pkg.develop(path=ENV["MFLA_DIR"])
              Pkg.develop(path=ENV["BFLA_DIR"])
              Pkg.add(["MultiFloats", "GenericLinearAlgebra", "StableRNGs"])
              Pkg.precompile()
            '
          done 2>&1 | tee "$OUT_DIR/benchmark-environments.log"

      - name: Run parent and candidate canonical micro suites
        shell: bash
        run: |
          set -euo pipefail
          julia --startup-file=no --project="$BASELINE_ENV" \
            "$BASELINE_DIR/benchmark/runner.jl" micro \
            --samples=3 --output="$OUT_DIR/baseline-micro.toml" --verbose \
            2>&1 | tee "$OUT_DIR/baseline-micro.log"
          julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/runner.jl micro \
            --samples=3 --output="$OUT_DIR/candidate-micro.toml" --verbose \
            2>&1 | tee "$OUT_DIR/candidate-micro.log"
          julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/compare.jl \
            "$OUT_DIR/baseline-micro.toml" \
            "$OUT_DIR/candidate-micro.toml" \
            "$OUT_DIR/micro-comparison.tsv" \
            2>&1 | tee "$OUT_DIR/micro-comparison.log"

      - name: Run parent and candidate LP-SOCP-SDP precision matrices
        shell: bash
        run: |
          set -euo pipefail
          julia --startup-file=no --project="$BASELINE_ENV" \
            "$BASELINE_DIR/benchmark/runner.jl" core_matrix \
            --samples=3 --output="$OUT_DIR/baseline-core-matrix.toml" --verbose \
            2>&1 | tee "$OUT_DIR/baseline-core-matrix.log"
          julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/runner.jl core_matrix \
            --samples=3 --output="$OUT_DIR/candidate-core-matrix.toml" --verbose \
            2>&1 | tee "$OUT_DIR/candidate-core-matrix.log"
          julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/compare.jl \
            "$OUT_DIR/baseline-core-matrix.toml" \
            "$OUT_DIR/candidate-core-matrix.toml" \
            "$OUT_DIR/core-matrix-comparison.tsv" \
            2>&1 | tee "$OUT_DIR/core-matrix-comparison.log"

      - name: Run fresh-process stability matrix on candidate
        shell: bash
        run: |
          set -euo pipefail
          julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/core_matrix_fresh_process.jl \
            --project="$CANDIDATE_ENV" \
            --repetitions=3 \
            --threads=1 \
            --blas-threads=1 \
            --campaign-dir="$OUT_DIR/fresh-core-matrix" \
            --verbose \
            2>&1 | tee "$OUT_DIR/fresh-core-matrix.log"

      - name: Record source and environment identity
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "$OUT_DIR"
          git rev-parse HEAD > "$OUT_DIR/source-commit.txt"
          git rev-parse HEAD^ > "$OUT_DIR/parent-commit.txt"
          git status --porcelain=v1 > "$OUT_DIR/source-status.txt"
          git diff --check > "$OUT_DIR/diff-check.txt"
          julia --version > "$OUT_DIR/julia-version.txt" 2>&1 || true
          uname -a > "$OUT_DIR/uname.txt"

      - name: Upload complete optimization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdpx-optimization-${{ github.sha }}
          path: optimization-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Persist successful evidence in Git history
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          record_dir="benchmark/history/${GITHUB_SHA}"
          mkdir -p "$record_dir"
          cp "$OUT_DIR/candidate-micro.toml" "$record_dir/micro.toml"
          cp "$OUT_DIR/candidate-micro.tsv" "$record_dir/micro.tsv"
          cp "$OUT_DIR/micro-comparison.tsv" "$record_dir/micro-comparison.tsv"
          cp "$OUT_DIR/candidate-core-matrix.toml" "$record_dir/core-matrix.toml"
          cp "$OUT_DIR/candidate-core-matrix.tsv" "$record_dir/core-matrix.tsv"
          cp "$OUT_DIR/core-matrix-comparison.tsv" "$record_dir/core-matrix-comparison.tsv"
          cp "$OUT_DIR/fresh-core-matrix/core_matrix_summary.toml" \
            "$record_dir/fresh-core-matrix.toml"
          cp "$OUT_DIR/fresh-core-matrix/core_matrix_summary.tsv" \
            "$record_dir/fresh-core-matrix.tsv"
          cat > "$record_dir/README.md" <<EOF
          # Optimization evidence for ${GITHUB_SHA}

          - Tested commit: \`${GITHUB_SHA}\`
          - Parent baseline: \`$(git rev-parse HEAD^)\`
          - Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Julia threads: 1
          - BLAS threads: 1
          - Quick correctness suite: passed
          - Canonical micro parent/candidate comparison: passed
          - LP/SOCP/SDP × Float64/Float64x4/BigFloat256 comparison: passed
          - Three-process candidate stability matrix: passed
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "$record_dir/README.md" \
            "$record_dir/micro.toml" \
            "$record_dir/micro.tsv" \
            "$record_dir/micro-comparison.tsv" \
            "$record_dir/core-matrix.toml" \
            "$record_dir/core-matrix.tsv" \
            "$record_dir/core-matrix-comparison.tsv" \
            "$record_dir/fresh-core-matrix.toml" \
            "$record_dir/fresh-core-matrix.tsv"
          git commit -m "perf: record optimization evidence for ${short_sha}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish optimization gate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='correctness and benchmark comparisons passed'
          else
            state=failure
            description='correctness or benchmark gate failed'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='sdpx/optimization-loop' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
