name: Optimization loop

on:
  push:
    branches:
      - refactor/benchmark-driven-core-20260821
  workflow_dispatch:

concurrency:
  group: optimization-loop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  correctness-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      SDPX_TEST_PROFILE: quick
      OUT_DIR: ${{ github.workspace }}/optimization-artifacts
      PROVIDER_ENV: ${{ runner.temp }}/sdpx-optimization-env
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark optimization gate pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='sdpx/optimization-loop' \
            -f description='quick tests and fixed multi-precision benchmark are running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - uses: julia-actions/cache@v2

      - name: Run quick correctness suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()' \
            2>&1 | tee "$OUT_DIR/quick-tests.log"

      - name: Clone pinned extended-precision providers
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/yongjunx23-del/MultiFloatLinearAlgebra.jl.git "$RUNNER_TEMP/MFLA"
          git -C "$RUNNER_TEMP/MFLA" checkout 2b93685c773db323e9397e448063925dc6cb96fe
          git clone https://github.com/yongjunx23-del/BigFloatLinearAlgebra.jl.git "$RUNNER_TEMP/BFLA"
          git -C "$RUNNER_TEMP/BFLA" checkout b2aed396718d03c60faf017388c3e2fc30934513

      - name: Build benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROVIDER_ENV"
          julia --startup-file=no --project="$PROVIDER_ENV" -e '
            using Pkg
            Pkg.develop(path=ENV["GITHUB_WORKSPACE"])
            Pkg.develop(path=joinpath(ENV["RUNNER_TEMP"], "MFLA"))
            Pkg.develop(path=joinpath(ENV["RUNNER_TEMP"], "BFLA"))
            Pkg.add(["MultiFloats", "GenericLinearAlgebra", "StableRNGs"])
            Pkg.precompile()
          ' 2>&1 | tee "$OUT_DIR/benchmark-environment.log"

      - name: Run canonical micro benchmark
        shell: bash
        run: |
          set -euo pipefail
          julia --startup-file=no --project="$PROVIDER_ENV" benchmark/runner.jl micro \
            --samples=3 \
            --output="$OUT_DIR/micro.toml" \
            --verbose \
            2>&1 | tee "$OUT_DIR/micro.log"

      - name: Run fixed LP-SOCP-SDP precision matrix
        shell: bash
        run: |
          set -euo pipefail
          julia --startup-file=no --project="$PROVIDER_ENV" benchmark/core_matrix_fresh_process.jl \
            --project="$PROVIDER_ENV" \
            --repetitions=3 \
            --threads=1 \
            --blas-threads=1 \
            --campaign-dir="$OUT_DIR/core-matrix" \
            --verbose \
            2>&1 | tee "$OUT_DIR/core-matrix.log"

      - name: Record source and environment identity
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "$OUT_DIR"
          git rev-parse HEAD > "$OUT_DIR/source-commit.txt"
          git status --porcelain=v1 > "$OUT_DIR/source-status.txt"
          git diff --check > "$OUT_DIR/diff-check.txt"
          julia --version > "$OUT_DIR/julia-version.txt" 2>&1 || true
          uname -a > "$OUT_DIR/uname.txt"
          tar --exclude=.git --exclude=optimization-artifacts \
            -czf "$OUT_DIR/source-snapshot.tar.gz" .

      - name: Upload optimization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdpx-optimization-${{ github.sha }}
          path: optimization-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Publish optimization gate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='quick tests and fixed multi-precision benchmark passed'
          else
            state=failure
            description='optimization correctness or benchmark gate failed'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='sdpx/optimization-loop' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
