name: Optimization loop

on:
  # Manual for now: running the ~2h parent-versus-candidate loop on every push
  # is a policy decision. The day-to-day benchmark loop lives in
  # benchmark/WORKFLOW.md (local Mac). This workflow records evidence for one
  # frozen candidate; base_sha must be the task's explicit base, not HEAD^.
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Explicit base SHA for the parent-versus-candidate comparison.'
        required: true
        type: string

concurrency:
  group: optimization-loop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  statuses: write

jobs:
  benchmark:
    name: Correctness and candidate benchmarks
    uses: ./.github/workflows/optimization-benchmark.yml
    with:
      post_status: true
    permissions:
      contents: read
      actions: read
      statuses: write

  persist-evidence:
    name: Persist evidence to an immutable evidence ref
    needs: benchmark
    if: needs.benchmark.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: sdpx-optimization-${{ github.sha }}
          path: optimization-artifacts
      - name: Validate base_sha ancestry and persist evidence off-branch
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${{ inputs.base_sha }}" "${{ github.sha }}"; then
            echo "base_sha '${{ inputs.base_sha }}' is not an ancestor of '${{ github.sha }}'" >&2
            exit 1
          fi
          short_sha="${GITHUB_SHA:0:12}"
          base_sha_full="$(git rev-parse "${{ inputs.base_sha }}"^{commit})"
          record_dir="evidence/${{ github.sha }}"
          mkdir -p "$record_dir"
          # Persist exactly the artifacts the benchmark workflow actually emits.
          cp optimization-artifacts/quick-tests.log "$record_dir/quick-tests.log"
          cp optimization-artifacts/candidate-smoke.toml "$record_dir/candidate-smoke.toml"
          cp optimization-artifacts/candidate-smoke.log "$record_dir/candidate-smoke.log"
          cp optimization-artifacts/hsd-allocation.log "$record_dir/hsd-allocation.log"
          cp optimization-artifacts/fresh-smoke/summary.toml "$record_dir/fresh-smoke-summary.toml"
          cp optimization-artifacts/source-commit.txt "$record_dir/source-commit.txt"
          cp optimization-artifacts/source-status.txt "$record_dir/source-status.txt"
          cp optimization-artifacts/julia-version.txt "$record_dir/julia-version.txt"
          cat > "$record_dir/README.md" <<EOF
          # Optimization evidence for ${GITHUB_SHA}

          - Tested commit (candidate): \`${GITHUB_SHA}\`
          - Base SHA (explicit input): \`$base_sha_full\`
          - Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Quick correctness suite: passed
          - Schema-v8 smoke suite and native HSD allocation gate: passed
          - Fresh-process stability matrix: passed
          - Evidence is immutable on this ref keyed by candidate SHA.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$record_dir"
          git commit -qm "perf: record optimization evidence for ${short_sha}"
          # Never push onto the candidate branch (that would mutate the frozen
          # candidate SHA). Push to a separate evidence ref keyed by candidate SHA.
          git push origin "HEAD:refs/heads/evidence/${{ github.sha }}"

  publish-status:
    name: Publish optimization gate status
    needs: [benchmark, persist-evidence]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      BENCHMARK_RESULT: ${{ needs.benchmark.result }}
      EVIDENCE_RESULT: ${{ needs.persist-evidence.result }}
    steps:
      - name: Publish optimization gate status
        shell: bash
        run: |
          if [ "$BENCHMARK_RESULT" = success ] && [ "$EVIDENCE_RESULT" = success ]; then
            state=success
            description='correctness and benchmark evidence persisted'
          else
            state=failure
            description='correctness or benchmark evidence gate failed'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='sdpx/optimization-loop' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
