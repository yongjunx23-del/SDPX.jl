name: Optimization loop

on:
  push:
    branches:
      - refactor/benchmark-driven-core-20260821
  workflow_dispatch:

concurrency:
  group: optimization-loop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  statuses: write

jobs:
  correctness-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      SDPX_TEST_PROFILE: quick
      OUT_DIR: ${{ github.workspace }}/optimization-artifacts
      PROVIDER_ENV: ${{ runner.temp }}/sdpx-optimization-env
      BASELINE_DIR: ${{ runner.temp }}/sdpx-parent
      BASELINE_ENV: ${{ runner.temp }}/sdpx-parent-env
      CANDIDATE_ENV: ${{ runner.temp }}/sdpx-candidate-env
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark optimization gate pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='sdpx/optimization-loop' \
            -f description='tests and parent-versus-candidate benchmarks are running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - uses: julia-actions/cache@v2

      - name: Run quick correctness suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()' \
            2>&1 | tee "$OUT_DIR/quick-tests.log"

      - name: Prepare parent and candidate microbenchmark environments
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$BASELINE_DIR" HEAD^
          mkdir -p "$BASELINE_ENV" "$CANDIDATE_ENV"
          julia --startup-file=no --project="$BASELINE_ENV" -e '
            using Pkg
            Pkg.develop(path=ENV["BASELINE_DIR"])
            Pkg.instantiate()
            Pkg.precompile()
          ' 2>&1 | tee "$OUT_DIR/coo-baseline-environment.log"
          julia --startup-file=no --project="$CANDIDATE_ENV" -e '
            using Pkg
            Pkg.develop(path=ENV["GITHUB_WORKSPACE"])
            Pkg.instantiate()
            Pkg.precompile()
          ' 2>&1 | tee "$OUT_DIR/coo-candidate-environment.log"

      - name: Compare sparse COO contraction with parent commit
        shell: bash
        run: |
          set -euo pipefail
          SDPX_BENCHMARK_SOURCE_ROOT="$BASELINE_DIR" \
            julia --startup-file=no --project="$BASELINE_ENV" \
            benchmark/micro/coo_contraction.jl run "$OUT_DIR/coo-baseline.toml" \
            --repetitions=100000 --samples=15 \
            2>&1 | tee "$OUT_DIR/coo-baseline.log"
          SDPX_BENCHMARK_SOURCE_ROOT="$GITHUB_WORKSPACE" \
            julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/micro/coo_contraction.jl run "$OUT_DIR/coo-candidate.toml" \
            --repetitions=100000 --samples=15 \
            2>&1 | tee "$OUT_DIR/coo-candidate.log"
          julia --startup-file=no --project="$CANDIDATE_ENV" \
            benchmark/micro/coo_contraction.jl compare \
            "$OUT_DIR/coo-baseline.toml" "$OUT_DIR/coo-candidate.toml" \
            "$OUT_DIR/coo-comparison.toml" \
            2>&1 | tee "$OUT_DIR/coo-comparison.log"

      - name: Clone pinned extended-precision providers
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/yongjunx23-del/MultiFloatLinearAlgebra.jl.git "$RUNNER_TEMP/MFLA"
          git -C "$RUNNER_TEMP/MFLA" checkout 2b93685c773db323e9397e448063925dc6cb96fe
          git clone https://github.com/yongjunx23-del/BigFloatLinearAlgebra.jl.git "$RUNNER_TEMP/BFLA"
          git -C "$RUNNER_TEMP/BFLA" checkout b2aed396718d03c60faf017388c3e2fc30934513

      - name: Build benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROVIDER_ENV"
          julia --startup-file=no --project="$PROVIDER_ENV" -e '
            using Pkg
            Pkg.develop(path=ENV["GITHUB_WORKSPACE"])
            Pkg.develop(path=joinpath(ENV["RUNNER_TEMP"], "MFLA"))
            Pkg.develop(path=joinpath(ENV["RUNNER_TEMP"], "BFLA"))
            Pkg.add(["MultiFloats", "GenericLinearAlgebra", "StableRNGs"])
            Pkg.precompile()
          ' 2>&1 | tee "$OUT_DIR/benchmark-environment.log"

      - name: Run canonical micro benchmark
        shell: bash
        run: |
          set -euo pipefail
          julia --startup-file=no --project="$PROVIDER_ENV" benchmark/runner.jl micro \
            --samples=3 \
            --output="$OUT_DIR/micro.toml" \
            --verbose \
            2>&1 | tee "$OUT_DIR/micro.log"

      - name: Run fixed LP-SOCP-SDP precision matrix
        shell: bash
        run: |
          set -euo pipefail
          julia --startup-file=no --project="$PROVIDER_ENV" benchmark/core_matrix_fresh_process.jl \
            --project="$PROVIDER_ENV" \
            --repetitions=3 \
            --threads=1 \
            --blas-threads=1 \
            --campaign-dir="$OUT_DIR/core-matrix" \
            --verbose \
            2>&1 | tee "$OUT_DIR/core-matrix.log"

      - name: Record source and environment identity
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "$OUT_DIR"
          git rev-parse HEAD > "$OUT_DIR/source-commit.txt"
          git rev-parse HEAD^ > "$OUT_DIR/parent-commit.txt"
          git status --porcelain=v1 > "$OUT_DIR/source-status.txt"
          git diff --check > "$OUT_DIR/diff-check.txt"
          julia --version > "$OUT_DIR/julia-version.txt" 2>&1 || true
          uname -a > "$OUT_DIR/uname.txt"
          tar --exclude=.git --exclude=optimization-artifacts \
            -czf "$OUT_DIR/source-snapshot.tar.gz" .

      - name: Upload optimization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdpx-optimization-${{ github.sha }}
          path: optimization-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Persist successful benchmark evidence in Git history
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          record_dir="benchmark/history/${GITHUB_SHA}"
          mkdir -p "$record_dir"
          cp "$OUT_DIR/coo-comparison.toml" "$record_dir/coo-comparison.toml"
          cp "$OUT_DIR/micro.toml" "$record_dir/micro.toml"
          cp "$OUT_DIR/micro.tsv" "$record_dir/micro.tsv"
          cp "$OUT_DIR/core-matrix/core_matrix_summary.toml" \
            "$record_dir/core-matrix.toml"
          cp "$OUT_DIR/core-matrix/core_matrix_summary.tsv" \
            "$record_dir/core-matrix.tsv"
          cat > "$record_dir/README.md" <<EOF
          # Optimization evidence for ${GITHUB_SHA}

          - Tested commit: \`${GITHUB_SHA}\`
          - Parent baseline: \`$(git rev-parse HEAD^)\`
          - GitHub Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Julia threads: 1
          - BLAS threads: 1
          - Quick correctness suite: passed
          - Canonical micro suite: passed
          - Fixed LP/SOCP/SDP × Float64/Float64x4/BigFloat256 matrix: passed
          - Sparse COO parent comparison: see \`coo-comparison.toml\`
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "$record_dir/README.md" \
            "$record_dir/coo-comparison.toml" \
            "$record_dir/micro.toml" \
            "$record_dir/micro.tsv" \
            "$record_dir/core-matrix.toml" \
            "$record_dir/core-matrix.tsv"
          git commit -m "perf: record optimization evidence for ${short_sha}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish optimization gate status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='tests and parent-versus-candidate benchmarks passed'
          else
            state=failure
            description='optimization correctness or benchmark gate failed'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='sdpx/optimization-loop' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
