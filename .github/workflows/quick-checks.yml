name: Quick checks

# Fast structural sanity gate: everything here is stdlib-only (no package
# installation, no solver runs), so the whole job finishes in about a minute.
# It is deliberately NOT a replacement for the full test suite -- it catches
# the breakage classes a structural/refactor change can introduce:
#
#   1. workflow files that no longer parse as YAML;
#   2. Julia files with syntax errors anywhere in the tree;
#   3. release metadata drift (Project.toml versions, [compat] coverage,
#      CITATION.cff) via the existing scripts/check_release_metadata.jl;
#   4. test files referenced by runtests.jl that no longer exist, and test
#      files on disk that are mounted neither in runtests.jl nor on the
#      documented manual-only allowlist;
#   5. documentation pages listed in docs/make.jl that do not exist.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    name: Structural sanity (stdlib-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Validate workflow YAML
        run: |
          python3 - <<'EOF'
          import glob, sys
          try:
              import yaml
          except ImportError:
              sys.exit("PyYAML unavailable on the runner image")
          bad = []
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  with open(path) as io:
                      yaml.safe_load(io)
              except Exception as error:
                  bad.append(f"{path}: {error}")
          if bad:
              sys.exit("invalid workflow YAML:\n" + "\n".join(bad))
          print(f"all {len(glob.glob('.github/workflows/*.yml'))} workflow files parse")
          EOF

      - name: Julia syntax check (parse only, no package load)
        run: |
          julia --startup-file=no -e '
          root = pwd()
          files = String[]
          for dir in ("src", "test", "validation", "benchmark", "bin",
                      "scripts", "ext", "examples", "docs")
              path = joinpath(root, dir)
              isdir(path) || continue
              for (rootdir, _, filenames) in walkdir(path)
                  for f in filenames
                      endswith(f, ".jl") &&
                          push!(files, relpath(joinpath(rootdir, f), root))
                  end
              end
          end
          files = unique(files)
          failures = String[]
          for f in files
              try
                  Meta.parseall(read(f, String); filename=f)
              catch error
                  push!(failures, "$f: $(error)")
              end
          end
          isempty(failures) ||
              error("syntax errors:\n" * join(failures, "\n"))
          println("parsed ", length(files), " Julia files cleanly")'

      - name: Release metadata consistency
        run: julia --startup-file=no scripts/check_release_metadata.jl

      - name: Test layout integrity
        run: |
          julia --startup-file=no -e '
          # Every test/*.jl must be mounted in runtests.jl or on the
          # documented manual-only allowlist. The standalone provider-gated
          # and provenance-pinned suites are executed by explicit drivers
          # (validation/scientific_core/run_private_sparse_pattern.jl etc.),
          # not by the standard suite.
          source = read("test/runtests.jl", String)
          mounted = Set{String}()
          for m in eachmatch(r"\"([^\"]+\.jl)\"", source)
              push!(mounted, m.captures[1])
          end
          manual_only = Set([
              "experimental_sparse_core.jl",
              "experimental_sparse_core_identity.jl",
              "experimental_sparse_core_numerics.jl",
              "experimental_sparse_core_ordering.jl",
              "experimental_sparse_core_research_support.jl",
              "private_sparse_pattern.jl",
              "qdldl_legacy_ordering.jl",
              "test_r4a_pairing_matrix.jl",
              "test_r1b_owned_object_matrix.jl",
          ])
          unmounted = String[]
          for f in readdir("test")
              endswith(f, ".jl") || continue
              f == "runtests.jl" && continue
              (f in mounted || f in manual_only) || push!(unmounted, f)
          end
          isempty(unmounted) || error(
              "test files neither mounted in runtests.jl nor manual-only " *
              "allowlisted: " * join(sort(unmounted), ", "))
          occursin("GenericConicBenchmark.jl", source) || error(
              "sole E2E must source cases from benchmark/general")
          occursin("SDPX public modeling-to-certified-result E2E", source) ||
              error("sole E2E contract marker missing")
          println("test layout is intact: ", length(mounted),
              " mounted, ", length(manual_only), " manual-only allowlisted")'

      - name: Documentation page integrity
        run: |
          julia --startup-file=no -e '
          pages = Set{String}()
          for m in eachmatch(r"\"([a-z0-9_\-/]+\.md)\"", read("docs/make.jl", String))
              push!(pages, m.captures[1])
          end
          missing = sort!([p for p in pages if !isfile(joinpath("docs", "src", p))])
          isempty(missing) ||
              error("docs/make.jl lists missing pages: " * join(missing, ", "))
          println("all ", length(pages), " documented pages exist in docs/src")'
