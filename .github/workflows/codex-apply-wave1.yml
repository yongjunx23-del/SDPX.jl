name: Codex apply Wave 1

on:
  push:
    branches:
      - development/v0.5-execution-plan
    paths:
      - .codex/wave1.patch.gz.b64
      - .github/workflows/codex-apply-wave1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Apply and isolate the N2 equality-scaling commit
        run: |
          set -euo pipefail
          if git log --format=%s -n 40 | grep -Fxq 'fix: make equality solves coordinate-scale invariant'; then
            echo 'N2 is already present.'
            exit 0
          fi
          base64 --decode .codex/wave1.patch.gz.b64 > "$RUNNER_TEMP/wave1.patch.gz"
          gzip -dc "$RUNNER_TEMP/wave1.patch.gz" > "$RUNNER_TEMP/wave1.patch"
          echo '31d584e6b063c92996f16b8a8e5719bb0c3a9580cc5417a1f3a8e6bfe7930076  '"$RUNNER_TEMP/wave1.patch" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mails"
          count=$(git mailsplit -d4 -o"$RUNNER_TEMP/mails" "$RUNNER_TEMP/wave1.patch")
          test "$count" = 2
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.invalid'
          git am --3way "$RUNNER_TEMP/mails/0001"
          git log -1 --format=%s | grep -Fx 'fix: make equality solves coordinate-scale invariant'
          git diff --check HEAD~1..HEAD
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run quick regression profile
        env:
          JULIA_NUM_THREADS: '1'
          SDPX_TEST_PROFILE: quick
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.test(; coverage=false)'
      - name: Run focused N2 regressions
        env:
          JULIA_NUM_THREADS: '1'
        run: |
          julia --startup-file=no --project=. -e '
            using SDPX, Test, LinearAlgebra, SparseArrays, Random
            using MultiFloats: Float64x4
            include("test/kkt_regressions.jl")
          '
      - name: Push the validated N2 commit
        run: git push origin HEAD:development/v0.5-execution-plan
