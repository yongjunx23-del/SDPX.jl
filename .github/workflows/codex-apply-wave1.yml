name: Codex apply Wave 1

on:
  push:
    branches:
      - development/v0.5-execution-plan
    paths:
      - .codex/wave1.patch.gz.b64
      - .github/workflows/codex-apply-wave1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Apply the reviewed Wave 1 commits
        run: |
          set -euo pipefail
          if git log --format=%s -n 40 | grep -Fxq 'fix: preserve minimal original-coordinate success gates'; then
            echo 'Wave 1 is already present.'
            exit 0
          fi
          base64 --decode .codex/wave1.patch.gz.b64 > "$RUNNER_TEMP/wave1.patch.gz"
          gzip -dc "$RUNNER_TEMP/wave1.patch.gz" > "$RUNNER_TEMP/wave1.patch"
          echo 'a3656401dd8e98f2e8ba946529595998c932b0dfe0776cf3ef14dfd17054eb8a  '"$RUNNER_TEMP/wave1.patch" | sha256sum -c -
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.invalid'
          git am --3way "$RUNNER_TEMP/wave1.patch"
          git diff --check HEAD~6..HEAD
          test "$(git rev-list --count HEAD~6..HEAD)" = 6
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run quick regression profile
        env:
          JULIA_NUM_THREADS: '1'
          SDPX_TEST_PROFILE: quick
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.test(; coverage=false)'
      - name: Run focused Wave 1 regressions
        env:
          JULIA_NUM_THREADS: '1'
        run: |
          julia --startup-file=no --project=. -e '
            using SDPX, Test, LinearAlgebra, SparseArrays, Random
            using MultiFloats: Float64x4
            include("test/adaptive_parameter_policy.jl")
            include("test/kkt_regressions.jl")
            include("test/result_certificate.jl")
          '
      - name: Push the validated commits
        run: git push origin HEAD:development/v0.5-execution-plan
