name: Provider version matrix

# Wave B: exercise the quick test profile across the supported provider
# version matrix. Each provider axis (MFLA, BFLA, LinearSolve) is pinned to
# its released minimum and its current version, so a provider release that
# breaks SDPX is caught here rather than only on the default resolution.
#
# The default provider set is covered by test.yml; this workflow deliberately
# re-resolves each provider to a pinned version before running the quick
# profile, so the matrix is about provider-version compatibility, not about
# the default dependency resolution.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-matrix:
    name: ${{ matrix.provider }} ${{ matrix.version }} / quick
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One leg per provider axis at its released minimum and current
        # version. Versions mirror the [compat] bounds in Project.toml:
        #   MultiFloatLinearAlgebra = "0.1, 0.2"
        #   BigFloatLinearAlgebra   = "0.1"
        #   LinearSolve             = "5"
        include:
          - provider: MFLA
            package: MultiFloatLinearAlgebra
            version: '0.1'
          - provider: MFLA
            package: MultiFloatLinearAlgebra
            version: '0.2'
          - provider: BFLA
            package: BigFloatLinearAlgebra
            version: '0.1'
          - provider: BFLA
            package: BigFloatLinearAlgebra
            version: '0.1.1'
          - provider: LinearSolve
            package: LinearSolve
            version: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
        with:
          cache-name: julia-depot
      - name: Pin ${{ matrix.provider }} ${{ matrix.version }}
        run: julia --project=. -e 'using Pkg; Pkg.add("MultiFloats"); Pkg.add(PackageSpec(name=ENV["PKG"], version=ENV["VER"]))'
        env:
          PKG: ${{ matrix.package }}
          VER: ${{ matrix.version }}
      - name: Run quick test profile
        env:
          SDPX_TEST_PROFILE: e2e
        run: julia --project=. -e 'using Pkg; Pkg.test()'
